<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>💧🥬生菜重量計算_水耕_川聖_箱裝 </title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <!-- 引入 Tailwind CSS 提升 UI 質感與響應式佈局 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: "Microsoft JhengHei", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f0f2f5;
        }
        /* 隱藏 Chrome, Safari, Edge, Opera 的數字輸入框上下箭頭 */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        /* 隱藏 Firefox 的數字輸入框上下箭頭 */
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
</head>

<body class="p-4 md:p-6 min-h-screen pb-32">

<div class="max-w-4xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-100">
    <!-- 標頭 -->
    <div class="bg-gradient-to-r from-green-600 to-emerald-700 p-6 text-white text-center">
        <h1 class="text-2xl md:text-3xl font-extrabold tracking-wide flex items-center justify-center gap-2">
            <span>💧🥬</span> 生菜重量計算 <span class="text-sm bg-white/20 px-3 py-1 rounded-full font-normal">水耕_川聖_箱裝</span>
        </h1>
        <!-- 恢復資料提醒 -->
        <div id="restoreNotice" class="hidden mt-3 bg-amber-500 text-white text-sm font-semibold py-1.5 px-4 rounded-full inline-flex items-center gap-1.5 animate-bounce shadow-md">
            <span>⚠️</span> 偵測到上次未清除的輸入資料，已為您自動載入
        </div>
    </div>

    <!-- 表格容器 (支援橫向捲動以利小螢幕讀取) -->
    <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
            <thead>
                <tr class="bg-gray-100 border-b border-gray-200 text-gray-700 font-bold text-sm md:text-base">
                    <th class="p-4 whitespace-nowrap">品項</th>
                    <th class="p-4 text-center whitespace-nowrap">總重 kg (最多三組)</th>
                    <th class="p-4 text-center whitespace-nowrap" style="width: 100px;">件數</th>
                    <th class="p-4 text-center whitespace-nowrap" style="width: 100px;">綠園板</th>
                    <th class="p-4 text-center whitespace-nowrap" style="width: 80px;">苔重</th>
                    <th class="p-4 text-center whitespace-nowrap" style="width: 120px;">實秤</th>
                </tr>
            </thead>
            <tbody id="tableBody" class="divide-y divide-gray-100">
                <!-- 透過 JS 動態產生 -->
            </tbody>`
        </table>
    </div>
</div>

<!-- 浮動操作按鈕 (FAB) -->
<div class="fixed bottom-6 right-6 flex flex-col gap-4 z-50">
    <!-- 複製按鈕 -->
    <button id="copyBtn" onclick="copyText()" class="flex items-center justify-center w-16 h-16 bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white rounded-full shadow-2xl transition-all duration-200 group relative">
        <span class="text-2xl">📋</span>
        <span class="absolute right-20 bg-gray-800 text-white text-xs py-1 px-2.5 rounded-lg whitespace-nowrap opacity-0 group-hover:opacity-100 transition-opacity duration-200 shadow-md">複製完整回報</span>
    </button>
    <!-- 清除按鈕 -->
    <button id="clearBtn" onclick="confirmClearAll()" class="flex items-center justify-center w-16 h-16 bg-red-600 hover:bg-red-500 active:scale-95 text-white rounded-full shadow-2xl transition-all duration-200 group relative">
        <span class="text-2xl">🗑️</span>
        <span class="absolute right-20 bg-gray-800 text-white text-xs py-1 px-2.5 rounded-lg whitespace-nowrap opacity-0 group-hover:opacity-100 transition-opacity duration-200 shadow-md">清除所有欄位</span>
    </button>
</div>

<!-- 自訂彈出式對話框 (Modal) 代替瀏覽器原生的 confirm -->
<div id="confirmModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50 backdrop-blur-sm transition-all duration-200">
    <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl transform scale-95 transition-transform duration-200">
        <h3 class="text-lg font-bold text-gray-900 flex items-center gap-2">
            <span class="text-red-500 text-2xl">⚠️</span> 確定清除資料？
        </h3>
        <p class="text-gray-500 mt-2 text-sm leading-relaxed">
            此操作將會清空目前表格內填寫的所有總重、件數與綠園板設定，且無法復原。
        </p>
        <div class="flex justify-end gap-3 mt-6">
            <button onclick="closeConfirmModal()" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium rounded-xl text-sm transition-colors">
                取消
            </button>
            <button id="modalConfirmBtn" class="px-4 py-2 bg-red-600 hover:bg-red-500 text-white font-medium rounded-xl text-sm transition-colors shadow-lg shadow-red-100">
                確定清除
            </button>
        </div>
    </div>
</div>

<!-- 自訂提示訊息 (Toast) 代替瀏覽器原生的 alert -->
<div id="toastContainer" class="fixed top-6 left-1/2 transform -translate-x-1/2 flex flex-col gap-2 z-50 pointer-events-none"></div>

<script>
const STORAGE_KEY = "lettuce_data_v5";
const BOARD_WEIGHT = 8.2;

const items = [
    {name:"本產美生菜", icon:"🥬", tare:1.45},
    {name:"本產蘿美(牛皮紙箱)", icon:"🥬", tare:1.51},
    {name:"本產蘿美(白箱)", icon:"⚪🥬", tare:1.42},
    {name:"進口美生菜［美國］", icon:"📦🥬", tare:1.58},
    {name:"進口美生菜［越南］", icon:"🟢📦🥬", tare:0.83},
    {name:"進口美生菜［韓國］", icon:"🔴📦🥬", tare:1.17},
    {name:"進口美生菜［馬來西亞］", icon:"🔵📦🥬", tare:1.08},
    {name:"進口蘿美(大包)", icon:"🖐️🥬", tare:1.06},
    {name:"進口蘿美(小包)", icon:"✊🥬", tare:1.51},
    {name:"奶油波士頓生菜(水耕)", icon:"🧈🥬", tare:1.49},
    {name:"紅甜脆生菜(水耕)", icon:"🔴🥬", tare:1.49},
    {name:"綠甜脆生菜(水耕)", icon:"🟢🥬", tare:1.49},
    {name:"綠水晶生菜(水耕)", icon:"🔵🥬", tare:1.49},
    {name:"廣東生菜", icon:"🟡🥬", tare:1.49}
];

const tbody = document.getElementById("tableBody");

// 渲染表格內容
items.forEach((item, i) => {
    const tr = document.createElement("tr");
    tr.id = `row_${i}`;
    tr.className = "hover:bg-gray-50/50 transition-colors duration-150 text-sm md:text-base";
    tr.innerHTML = `
        <td class="p-4 font-semibold text-gray-800 whitespace-nowrap">
            <!-- 使用 flex 版面配置，搭配 gap-2.5 徹底解決圖案與文字重疊的問題 -->
            <div class="flex items-center gap-2.5">
                <span class="inline-block shrink-0 text-left min-w-[2.2rem]">${item.icon}</span>
                <span class="truncate">${item.name}</span>
            </div>
        </td>
        <td class="p-4">
            <div class="flex items-center justify-center gap-1">
                <input type="number" step="0.01" id="w1_${i}" placeholder="-" class="w-16 md:w-20 p-2 text-center border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-green-500 bg-white shadow-sm transition-all text-base font-medium">
                <span class="text-gray-400 text-xs">+</span>
                <input type="number" step="0.01" id="w2_${i}" placeholder="-" class="w-16 md:w-20 p-2 text-center border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-green-500 bg-white shadow-sm transition-all text-base font-medium">
                <span class="text-gray-400 text-xs">+</span>
                <input type="number" step="0.01" id="w3_${i}" placeholder="-" class="w-16 md:w-20 p-2 text-center border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-green-500 bg-white shadow-sm transition-all text-base font-medium">
            </div>
        </td>
        <td class="p-4 text-center">
            <input type="number" id="count${i}" placeholder="0" class="w-16 p-2 text-center border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-green-500 bg-white shadow-sm transition-all text-base font-bold text-gray-800">
        </td>
        <td class="p-4 text-center">
            <select id="board${i}" class="w-16 p-2 text-center border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-green-500 bg-white shadow-sm transition-all text-base font-medium cursor-pointer">
                <option value="0" selected>0</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
            </select>
        </td>
        <td class="p-4 text-center text-gray-500 font-medium whitespace-nowrap">${item.tare}</td>
        <td class="p-4 text-center">
            <span id="result${i}" class="text-xl md:text-2xl font-black text-gray-900 tracking-tight">0.00</span>
        </td>
    `;
    tbody.appendChild(tr);
});

// 監聽所有輸入欄位的異動
document.addEventListener("input", calc);

function getWeight(i){
    let w1 = parseFloat(document.getElementById("w1_"+i).value) || 0;
    let w2 = parseFloat(document.getElementById("w2_"+i).value) || 0;
    let w3 = parseFloat(document.getElementById("w3_"+i).value) || 0;
    return w1 + w2 + w3;
}

function calc() {
    items.forEach((item, i) => {
        let weight = getWeight(i);
        const countVal = document.getElementById("count"+i).value;
        const boardVal = document.getElementById("board"+i).value;

        const resultCell = document.getElementById("result"+i);
        const row = document.getElementById("row_" + i);

        // 恢復初始背景與文字樣式
        row.classList.remove("bg-red-50", "bg-green-50", "hover:bg-red-50/70", "hover:bg-green-50/70");
        resultCell.classList.remove("text-red-600", "text-emerald-600");
        resultCell.classList.add("text-gray-900");

        if (weight === 0 && countVal === "") {
            resultCell.innerText = "0.00";
            return;
        }

        if (weight <= 0 || countVal === "" || parseInt(countVal) <= 0) {
            resultCell.innerText = "⚠️";
            resultCell.classList.add("text-red-600");
            row.classList.add("bg-red-50", "hover:bg-red-50/70");
            return;
        }

        let count = parseInt(countVal);
        let board = parseInt(boardVal);
        let tare = item.tare;

        let netWeight = weight - (tare * count) - (BOARD_WEIGHT * board);

        if (netWeight >= 0) {
            resultCell.innerText = netWeight.toFixed(2);
            resultCell.classList.remove("text-gray-900");
            resultCell.classList.add("text-emerald-600");
            row.classList.add("bg-green-50", "hover:bg-green-50/70");
        } else {
            resultCell.innerText = "⚠️";
            resultCell.classList.add("text-red-600");
            row.classList.add("bg-red-50", "hover:bg-red-50/70");
        }
    });

    saveData();
}

function saveData() {
    let data = items.map((_, i) => ({
        w1: document.getElementById("w1_"+i).value,
        w2: document.getElementById("w2_"+i).value,
        w3: document.getElementById("w3_"+i).value,
        count: document.getElementById("count"+i).value,
        board: document.getElementById("board"+i).value
    }));
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function loadData() {
    let saved = localStorage.getItem(STORAGE_KEY);
    if (!saved) return;

    let data = JSON.parse(saved);
    let hasData = false;

    data.forEach((d, i) => {
        if (!d) return;

        if (d.w1 || d.w2 || d.w3 || d.count) {
            hasData = true;
        }

        document.getElementById("w1_"+i).value = d.w1 || "";
        document.getElementById("w2_"+i).value = d.w2 || "";
        document.getElementById("w3_"+i).value = d.w3 || "";
        document.getElementById("count"+i).value = d.count || "";
        document.getElementById("board"+i).value = d.board || "0";
    });

    if (hasData) {
        document.getElementById("restoreNotice").classList.remove("hidden");
    }

    calc();
}

// 實作自訂 Toast 提示
function showToast(message, type = "success") {
    const container = document.getElementById("toastContainer");
    const toast = document.createElement("div");
    
    const bgClass = type === "success" ? "bg-gray-900" : "bg-red-600";
    toast.className = `${bgClass} text-white text-sm font-semibold py-3 px-6 rounded-xl shadow-2xl flex items-center gap-2 transition-all duration-300 transform translate-y-4 opacity-0 pointer-events-auto`;
    toast.innerHTML = `
        <span>${type === 'success' ? '✅' : 'ℹ️'}</span>
        <span>${message}</span>
    `;
    
    container.appendChild(toast);
    
    // 強制重繪以觸發動畫效果
    setTimeout(() => {
        toast.classList.remove("translate-y-4", "opacity-0");
    }, 10);
    
    // 3秒後自動消失
    setTimeout(() => {
        toast.classList.add("translate-y-4", "opacity-0");
        setTimeout(() => toast.remove(), 300);
    }, 3000);
}

// 實作自訂確認視窗 (Modal)
function confirmClearAll() {
    const modal = document.getElementById("confirmModal");
    modal.classList.remove("hidden");
    modal.classList.add("flex");
    
    const confirmBtn = document.getElementById("modalConfirmBtn");
    confirmBtn.onclick = function() {
        executeClearAll();
        closeConfirmModal();
    };
}

function closeConfirmModal() {
    const modal = document.getElementById("confirmModal");
    modal.classList.add("hidden");
    modal.classList.remove("flex");
}

function executeClearAll() {
    items.forEach((_, i) => {
        document.getElementById("w1_"+i).value = "";
        document.getElementById("w2_"+i).value = "";
        document.getElementById("w3_"+i).value = "";
        document.getElementById("count"+i).value = "";
        document.getElementById("board"+i).value = "0";
        document.getElementById("result"+i).innerText = "0.00";
        
        const row = document.getElementById("row_" + i);
        row.classList.remove("bg-red-50", "bg-green-50", "hover:bg-red-50/70", "hover:bg-green-50/70");
        document.getElementById("result"+i).className = "text-xl md:text-2xl font-black text-gray-900 tracking-tight";
    });

    localStorage.removeItem(STORAGE_KEY);
    document.getElementById("restoreNotice").classList.add("hidden");
    showToast("所有欄位已成功清除！", "success");
}

function copyText() {
    let output = "【生菜重量回報】\n";
    output += "------------------------\n";
    let hasData = false;

    items.forEach((item, i) => {
        let weight = getWeight(i);
        const countVal = document.getElementById("count"+i).value;

        if (weight > 0 && countVal !== "" && parseInt(countVal) > 0) {
            let count = parseInt(countVal);
            let board = parseInt(document.getElementById("board"+i).value);
            let tare = item.tare;

            // 格式化總重，保留至小數點後兩位
            let displayWeight = weight.toFixed(2);
            let result = (weight - (tare * count) - (BOARD_WEIGHT * board)).toFixed(2);

            // 依據條件輸出原料資訊
            if (item.name === "進口美生菜［越南］") {
                output += `原料:進口美生菜：${count}件\n`;
                output += "(成品:進口美生菜)\n"; }
//             else if (item.name === "進口美生菜［韓國］") {
//                output += `原料:${item.name}：${count}件\n`;
//                output += "(成品:進口美生菜)\n";} 
                else {
                output += `原料:${item.name}：${count}件\n`;
            }

            // 組合計算公式
            let calcText = `計算：${displayWeight} - (${tare}×${count})`;

            if (board > 0) {
                calcText += ` - (${BOARD_WEIGHT}×${board})`;
            }

            calcText += ` = ${result}kg\n`;

            output += calcText;
            output += `實秤：${result}kg\n\n`;
            hasData = true;
        }
    });

    if (!hasData) {
        return showToast("請至少輸入一筆完整的品項總重與件數資料！", "error");
    }

    // 🏆 相容性最高的剪貼簿複製方案，避免 sandbox/iframe 限制
    const tempTextArea = document.createElement("textarea");
    tempTextArea.value = output;
    // 設置定位防跑版
    tempTextArea.style.position = "fixed";
    tempTextArea.style.top = "0";
    tempTextArea.style.left = "0";
    tempTextArea.style.width = "2em";
    tempTextArea.style.height = "2em";
    tempTextArea.style.padding = "0";
    tempTextArea.style.border = "none";
    tempTextArea.style.outline = "none";
    tempTextArea.style.boxShadow = "none";
    tempTextArea.style.background = "transparent";
    
    document.body.appendChild(tempTextArea);
    tempTextArea.focus();
    tempTextArea.select();
    tempTextArea.setSelectionRange(0, 99999); // 適用行動裝置

    try {
        const successful = document.execCommand('copy');
        if (successful) {
            showToast("已成功複製完整回報文字！", "success");
        } else {
            showToast("複製失敗，請手動全選複製", "error");
        }
    } catch (err) {
        showToast("瀏覽器不支援一鍵複製，請手動複製", "error");
    }

    document.body.removeChild(tempTextArea);
}

// 載入資料
loadData();
</script>

</body>
</html>
